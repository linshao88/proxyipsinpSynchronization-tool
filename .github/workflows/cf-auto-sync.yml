name: Cloudflare IP Auto Scanner & Sync

on:
  schedule:
    # 北京时间 08:17 - 18:17，每两小时一次 (08:17, 10:17, 12:17, 14:17, 16:17, 18:17)
    # 对应 UTC 00:17 - 10:17
    - cron: '17 0-10/2 * * *'

    # 北京时间 19:17 - 23:17，每小时一次 (19:17, 20:17, 21:17, 22:17, 23:17)
    # 对应 UTC 11:17 - 15:17
    - cron: '17 11-15 * * *'

  # 允许手动运行
  workflow_dispatch:

# 防止同一个工作流同时运行，避免 Git 冲突
concurrency:
  group: cf-ip-scanner
  cancel-in-progress: false

jobs:
  scan-and-sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # ==============================
      # 1. 获取仓库代码
      # ==============================
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==============================
      # 2. 安装 Python
      # ==============================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ==============================
      # 3. 安装依赖
      # ==============================
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ==============================
      # 4. 执行 CF IP 扫描
      # ==============================
      - name: Run CF Scanner and Sync
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_TARGET_DOMAIN: ${{ secrets.CF_TARGET_DOMAIN }}
          CF_EMAIL: ${{ secrets.CF_EMAIL }}
          SYNC_COUNT: '5'
          SCAN_COUNT: '2000'
        run: |
          python scripts/cf_scanner_sync.py

      # ==============================
      # 5. 提交并推送 IP 文件
      # ==============================
      - name: Commit and Push IP Log
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'

          echo "检查 ips-v4.txt 是否发生变化..."

          # 添加 IP 文件
          git add ips-v4.txt

          # 如果没有变化，不创建空提交
          if git diff --cached --quiet; then
            echo "ips-v4.txt 没有变化，无需提交。"
            exit 0
          fi

          # 创建提交
          git commit -m "docs: 自动更新最新优选 IP [skip ci]"

          # ==============================
          # 推送机制
          # 最多重试 5 次，避免远程分支
          # 在工作流运行期间发生变化导致失败
          # ==============================

          for i in 1 2 3 4 5; do
            echo "======================================"
            echo "第 $i/5 次尝试同步并推送..."
            echo "======================================"

            # 获取远程最新 main
            git fetch origin main

            # 检查本地是否落后远程
            if git merge-base --is-ancestor HEAD origin/main; then
              echo "当前提交已经包含远程最新提交。"
            else
              echo "检测到远程有新的提交，执行 rebase..."

              if ! git rebase origin/main; then
                echo "Rebase 发生冲突，无法自动解决。"
                git rebase --abort || true
                exit 1
              fi
            fi

            # 推送到 main
            if git push origin HEAD:main; then
              echo "======================================"
              echo "推送成功！"
              echo "======================================"
              exit 0
            fi

            echo "推送失败，3 秒后重新获取远程代码并重试..."
            sleep 3
          done

          echo "======================================"
          echo "连续 5 次推送失败！"
          echo "======================================"
          exit 1

















