name: Cloudflare IP Auto Scanner & Sync

on:
  schedule:
    # 早上 02:00 - 18:00 每 2 小时 (对应 UTC 18:00 - 10:00)
    - cron: '0 18-22/2 * * *'
    - cron: '0 0-10/2 * * *'
    # 晚上 19:00 - 23:00 每 1 小时 (对应 UTC 11:00 - 15:00)
    - cron: '0 11-15 * * *'

  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

jobs:
  scan-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run CF Scanner and Sync
        env: 
          # GitHub Secrets injected as environment variables
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_TARGET_DOMAIN: ${{ secrets.CF_TARGET_DOMAIN }}
          CF_EMAIL: ${{ secrets.CF_EMAIL }}
          SYNC_COUNT: '5' # Number of IPs to keep in DNS
          SCAN_COUNT: '2000' # Number of IPs to test per run
        run: python scripts/cf_scanner_sync.py

      - name: Commit and Push IP Log (Native Git)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 1. 优先拉取远端最新提交（使用 rebase 模式保持提交历史整洁）
          git pull origin main --rebase || git rebase --skip
          
          # 2. 检查 ips-v4.txt 是否有更新
          if git status --porcelain | grep -q "ips-v4.txt"; then
            git add ips-v4.txt
            git commit -m "docs: 自动更新最新优选 IP [skip ci]"
            
            # 3. 强行或直接推送
            git push origin main || git push origin main --force
          else
            echo "IP 文件无变动，无需提交"
          fi







