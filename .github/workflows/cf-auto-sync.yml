name: Cloudflare IP Auto Scanner & Sync

on:
  schedule:
    # 北京时间 6:00, 8:00, 10:00
    # 对应 UTC 22:00, 0:00, 2:00
    - cron: '0 22,0,2 * * *'

    # 北京时间 19:00 - 23:00
    # 对应 UTC 11:00 - 15:00
    - cron: '0 11-15 * * *'

  # 允许手动运行
  workflow_dispatch:

# 防止多个工作流同时运行导致 Git 冲突
concurrency:
  group: cf-ip-scanner
  cancel-in-progress: false

jobs:
  scan-and-sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run CF Scanner and Sync
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_TARGET_DOMAIN: ${{ secrets.CF_TARGET_DOMAIN }}
          CF_EMAIL: ${{ secrets.CF_EMAIL }}
          SYNC_COUNT: '5'
          SCAN_COUNT: '2000'
        run: python scripts/cf_scanner_sync.py

      - name: Commit and Push IP Log
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          git add ips-v4.txt

          # 如果没有文件变化，直接退出
          git diff --cached --quiet && exit 0

          git commit -m "docs: 自动更新最新优选 IP [skip ci]"

          # 获取远程最新代码并采用 rebase
          git pull --rebase origin main

          # 正常推送
          git push origin main
















