name: Cloudflare IP Auto Scanner & Sync

on:
  schedule:
    # 北京时间 6:00, 8:00, 10:00 (对应 UTC 22:00, 0:00, 2:00)
    - cron: '0 22,0,2 * * *'
    # 晚上 19:00 - 23:00 每小时一次 (UTC 11:00 - 15:00)
    - cron: '0 11-15 * * *'

  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

jobs:
  scan-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run CF Scanner and Sync
        env: 
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_TARGET_DOMAIN: ${{ secrets.CF_TARGET_DOMAIN }}
          CF_EMAIL: ${{ secrets.CF_EMAIL }}
          SYNC_COUNT: '5' 
          SCAN_COUNT: '2000' 
        run: python scripts/cf_scanner_sync.py

      - name: Commit and Push IP Log
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: 自动更新最新IP [skip ci]"
          file_pattern: "ips-v4.txt"
          push_options: '--force'















